version: '3'

services:
  mg-identity-service:
    image: mg-identity-service:latest
    hostname: mg-identity-service
    env_file: .env
    build:
      dockerfile: Dockerfile
    environment:
      - spring.jpa.hibernate.ddl-auto=update
      - spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
      - spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    ports:
      - '8081:8081'
    networks:
      - mgi-backend-wrapper-network
    depends_on:
      - postgres
      - swagger-ui

  postgres:
    image: postgres:14.1-alpine
    hostname: postgres-mg-identity-service
    restart: always
    environment:
      POSTGRES_URL: ${DATASOURCE_URL}
      POSTGRES_DB: ${DATASOURCE_DB}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - '5432:5432'
    networks:
      - mgi-backend-wrapper-network
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - mgi-backend-wrapper-network
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    ports:
      - "2181:2181"
    networks:
      - mgi-backend-wrapper-network


  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8079:8079"
    environment:
      SWAGGER_JSON: /data/swagger.yml
    networks:
      - mgi-backend-wrapper-network
    volumes:
      - ./data:/data

networks:
  mgi-backend-wrapper-network:
    external: true

volumes:
  postgres_data:
    driver: local